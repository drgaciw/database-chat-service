# Test Configuration
spring.application.name=database-chat-service-test

# Use MongoDB test configuration
spring.data.mongodb.host=mongodb-test
spring.data.mongodb.port=27017
spring.data.mongodb.database=test
spring.data.mongodb.username=admin
spring.data.mongodb.password=password
spring.data.mongodb.authentication-database=admin

# Disable security for tests
spring.security.user.name=test
spring.security.user.password=test

# Custom JWT Configuration for tests
jwt.secret=test-secret-key-for-testing-purposes-only-not-for-production-use
jwt.expiration=3600000

# Logging Configuration
logging.level.root=INFO
logging.level.com.aciworldwide.database_chat_service=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Disable Spring Cloud Config Server for tests
spring.cloud.config.enabled=false
spring.cloud.config.discovery.enabled=false

# Disable Spring Cloud Gateway for tests
spring.cloud.gateway.enabled=false

# Disable Spring Cloud compatibility verifier
spring.cloud.compatibility-verifier.enabled=false

# Circuit Breaker Configuration for MCP Service
resilience4j.circuitbreaker.instances.mcpService.sliding-window-size=10
resilience4j.circuitbreaker.instances.mcpService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mcpService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.mcpService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.mcpService.register-health-indicator=true
resilience4j.circuitbreaker.instances.mcpService.allow-health-indicator-to-fail=true
resilience4j.circuitbreaker.instances.mcpService.automatic-transition-from-open-to-half-open-enabled=true

# Disable Eureka client for tests
eureka.client.enabled=false

# Testcontainers configuration
spring.testcontainers.reuse.enable=true