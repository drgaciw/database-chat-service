# Application Configuration
spring.application.name=database-chat-service
server.port=8080

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=product_chat_db

# JWT Configuration
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Logging Configuration
logging.level.root=INFO
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.com.aciworldwide.database_chat_service=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin

# Rate Limiting Configuration
rate-limit.requests-per-minute=100

# Actuator Configuration
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
management.info.env.enabled=true
info.app.name=Product Chat Service
info.app.java.version=21
info.app.type=Spring Boot
info.app.version=1.0.0
info.app.description=Service for managing and querying product data with chat-like interface

# Eureka Configuration
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost

# Virtual Threads Configuration
spring.threads.virtual.enabled=true

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# MongoDB MCP Server Configuration
mcp.server.url=http://localhost:3003
mcp.server.connection-timeout=5000
mcp.server.read-timeout=10000

# Circuit Breaker Configuration for MCP Service
resilience4j.circuitbreaker.instances.mcpService.sliding-window-size=10
resilience4j.circuitbreaker.instances.mcpService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.mcpService.wait-duration-in-open-state=10000
resilience4j.circuitbreaker.instances.mcpService.permitted-number-of-calls-in-half-open-state=3

# AI Configuration
spring.ai.openai.enabled=false
spring.ai.azure.openai.enabled=false
spring.ai.anthropic.enabled=false
