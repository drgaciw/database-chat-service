# Config Server Configuration
spring.application.name=config-server
server.port=8888

# Git Repository Configuration
# In a real environment, this would point to a Git repository
# For local development, we're using a local directory
spring.cloud.config.server.git.uri=file:///config-repo
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.clone-on-start=true

# Logging Configuration
logging.level.org.springframework.cloud.config=INFO

# Management Configuration
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always