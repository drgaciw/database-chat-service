# API Gateway Configuration
server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: database-chat-service
          uri: lb://database-chat-service
          predicates:
            - Path=/api/v1/**
          filters:
            - StripPrefix=0

# Eureka Configuration
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

# Logging Configuration
logging:
  level:
    org.springframework.cloud.gateway: INFO
    reactor.netty: INFO

# Management Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true